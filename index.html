<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Firefly Forest</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        ctx.fillStyle = "#202044";
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        function drawTree(x, y, size) {

            // Tronco
            ctx.fillStyle = "#5a4035";

            ctx.fillRect(
                x - size * 0.1,
                y - size * 0.4,
                size * 0.2,
                size * 0.4
            );


            // Silhueta escura atrás
            ctx.fillStyle = "#193b32";

            ctx.beginPath();

            ctx.moveTo(
                x,
                y - size * 1.15
            );

            ctx.lineTo(
                x - size * 0.65,
                y - size * 0.25
            );

            ctx.lineTo(
                x + size * 0.65,
                y - size * 0.25
            );

            ctx.closePath();

            ctx.fill();


            // Copa da árvore
            ctx.fillStyle = "#315c4b";

            ctx.beginPath();

            ctx.moveTo(
                x,
                y - size
            );

            ctx.lineTo(
                x - size * 0.5,
                y - size * 0.3
            );

            ctx.lineTo(
                x + size * 0.5,
                y - size * 0.3
            );

            ctx.closePath();

            ctx.fill();
        }
                    
        //desenhar floresta
        const forest = [];

        function generateForest() {

            for (let i = 0; i < 35; i++) {

                const tree = {

                    x: Math.random() * canvas.width,

                    y:
                        canvas.height * 0.55 +
                        Math.random() * canvas.height * 0.35,

                    size:
                        40 + Math.random() * 160
                };

                forest.push(tree);
            }

            forest.sort((a, b) => a.y - b.y);
        }
        
        function drawForest() {

            for (const tree of forest) {

                drawTree(
                    tree.x,
                    tree.y,
                    tree.size
                );
            }
        }
        
        let capturedFireflies = 0;

        const fireflies = [];

        for (let i = 0; i < 58; i++) {

            const firefly = {

                x: Math.random() * canvas.width,

                y: Math.random() * canvas.height * 0.7,

                size: 3 + Math.random() * 2,

                speedX: -0.3 + Math.random() * 0.6,

                speedY: -0.2 + Math.random() * 0.4,

                glow: Math.random(),

                glowSpeed: 0.01 + Math.random() * 0.02,

                // Controle do movimento
                angle: Math.random() * Math.PI * 2,

                turnSpeed: -0.02 + Math.random() * 0.04
            };

            fireflies.push(firefly);
        }

        function drawFirefly(firefly) {

            const brightness = firefly.glow;

            const glow = ctx.createRadialGradient(
                firefly.x,
                firefly.y,
                0,
                firefly.x,
                firefly.y,
                35
            );

            glow.addColorStop(
                0,
                `rgba(255, 246, 168, ${brightness})`
            );

            glow.addColorStop(
                1,
                "rgba(255, 246, 168, 0)"
            );

            ctx.fillStyle = glow;

            ctx.beginPath();

            ctx.arc(
                firefly.x,
                firefly.y,
                35,
                0,
                Math.PI * 2
            );

            ctx.fill();


            // Corpo do vagalume

            ctx.fillStyle =
                `rgba(255, 246, 168, ${brightness})`;

            ctx.beginPath();

            ctx.arc(
                firefly.x,
                firefly.y,
                firefly.size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        function updateFirefly(firefly) {

            // Movimento da direção
            firefly.angle += firefly.turnSpeed;

            firefly.speedX = Math.cos(firefly.angle) * 0.5;
            firefly.speedY = Math.sin(firefly.angle) * 0.5;

            firefly.x += firefly.speedX;
            firefly.y += firefly.speedY;


            // Limites da área dos vagalumes

            const margin = 60;

            if (firefly.x < margin) {
                firefly.angle = 0;
            }

            if (firefly.x > canvas.width - margin) {
                firefly.angle = Math.PI;
            }

            if (firefly.y < margin) {
                firefly.angle = Math.PI / 2;
            }

            if (firefly.y > canvas.height * 0.7 - margin) {
                firefly.angle = -Math.PI / 2;
            }


            // Brilho

            firefly.glow += firefly.glowSpeed;

            if (firefly.glow > 1 || firefly.glow < 0) {
                firefly.glowSpeed *= -1;
            }
        }

        function drawSky() {

            // Céu
            const gradient = ctx.createLinearGradient(
                0,
                0,
                0,
                canvas.height
            );

            gradient.addColorStop(0, "#302b5f");
            gradient.addColorStop(0.6, "#454575");
            gradient.addColorStop(1, "#6b6b91");

            ctx.fillStyle = gradient;

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
        }

        function drawMoon() {

            ctx.fillStyle = "#fff3c4";

            ctx.beginPath();

            ctx.arc(
                canvas.width * 0.8,
                canvas.height * 0.18,
                40,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        const stars = [];

        function generateStars() {

            for (let i = 0; i < 60; i++) {

                const star = {

                    x: Math.random() * canvas.width,

                    y: Math.random() * canvas.height * 0.55,

                    size: Math.random() * 2 + 1
                };

                stars.push(star);
            }
        }

        function drawStars() {

            ctx.fillStyle = "#fff6d6";

            for (const star of stars) {

                ctx.beginPath();

                ctx.arc(
                    star.x,
                    star.y,
                    star.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        }
        
        //desenhar chão
        function drawGround() {

            ctx.fillStyle = "#253b32";

            ctx.fillRect(
                0,
                canvas.height * 0.56,
                canvas.width,
                canvas.height * 0.5
            );
        }
    
        canvas.addEventListener("click", function(event) {

            const mouseX = event.clientX;
            const mouseY = event.clientY;

            for (let i = fireflies.length - 1; i >= 0; i--) {

                const firefly = fireflies[i];

                const distance = Math.sqrt(
                    (mouseX - firefly.x) ** 2 +
                    (mouseY - firefly.y) ** 2
                );

                if (distance < 25) {

                    fireflies.splice(i, 1);

                    capturedFireflies++;

                    break;
                }
            }
        });
    
        //--------------------------------------------------------
    //DESENHAR NA TELA (chamar as funções)  
   
        function drawUI() {

            ctx.fillStyle = "#fff6d6";

            ctx.font = "20px Arial";

            ctx.textAlign = "left";

            ctx.fillText(
                `Vagalumes: ${capturedFireflies} / 58`,
                25,
                35
            );
        }

        generateStars();
        generateForest();

        function gameLoop() {

            // Limpa o quadro anterior

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Desenha o cenário

            drawSky();

            drawStars();

            drawMoon();

            drawGround();

            drawForest();


            // Atualiza e desenha os vagalumes

            for (const firefly of fireflies) {

                updateFirefly(firefly);

                drawFirefly(firefly);
            }

            drawUI();
            // Próximo quadro

            requestAnimationFrame(gameLoop);
        }

        gameLoop();


    </script>


</body>

</html>
